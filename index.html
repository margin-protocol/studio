<!doctype html>
<html lang="zh-Hant-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO:START（打包後由 scripts/build-seo.mjs 依每一頁重新產生，這裡是首頁預設值） -->
    <title>MARGIN PROTOCOL.｜頁邊協定</title>
    <meta name="description" content="MARGIN PROTOCOL. 頁邊協定——結合文學、互動敘事、藝術設計、創意程式與數位產品的獨立創作工作室。Where stories meet systems." />
    <link rel="canonical" href="https://margin-protocol.github.io/studio/" />
    <!-- SEO:END -->
    <meta name="theme-color" content="#17191F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap"
    />

    <!-- 在畫面繪製前套用主題，避免閃爍。預設為夜間模式。 -->
    <script>
      try {
        var t = localStorage.getItem('mp-theme')
        if (t === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEE8DE')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- NOSCRIPT:START -->
    <noscript>
      <p style="padding:2rem;color:#F0EAE0;background:#17191F;font-family:sans-serif">
        MARGIN PROTOCOL. 頁邊協定——此網站需要啟用 JavaScript 才能瀏覽檔案館。
      </p>
    </noscript>
    <!-- NOSCRIPT:END -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
